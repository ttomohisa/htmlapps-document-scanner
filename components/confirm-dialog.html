<!-- Canonical destructive confirmation pattern adapted into src/index.template.html. -->
<dialog class="confirm-dialog" aria-labelledby="confirmTitle">
  <div class="confirm-body">
    <h2 id="confirmTitle"></h2>
    <p id="confirmMessage"></p>
  </div>
  <div class="confirm-actions">
    <button class="btn small" type="button" data-confirm-cancel>Cancel</button>
    <button class="btn small danger" type="button" data-confirm-ok>Delete</button>
  </div>
</dialog>
